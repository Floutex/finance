<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Zera">
  <style>
    .circle-stroke { stroke: #09090b; }
    .lens-fill { fill: #09090b; }
    @media (prefers-color-scheme: dark) {
      .circle-stroke { stroke: #ffffff; }
      .lens-fill { fill: #ffffff; }
    }
  </style>
  <defs>
    <clipPath id="lens">
      <circle cx="11.5" cy="16" r="8.5"/>
    </clipPath>
  </defs>

  <g fill="none" class="circle-stroke" stroke-width="2.2">
    <circle cx="11.5" cy="16" r="8.5"/>
    <circle cx="20.5" cy="16" r="8.5"/>
  </g>
  <circle cx="20.5" cy="16" r="8.5" class="lens-fill" clip-path="url(#lens)"/>
</svg>
